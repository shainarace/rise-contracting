<svg xmlns="http://w3.org" viewBox="0 0 1000 350" width="100%" height="100%">
  <defs>
    <!-- Define the exact branding color tokens for crisp rendering -->
    <style>
      .logo-navy { fill: #041d3a; }
      .logo-amber { fill: #d89100; }
    </style>
  </defs>

  <!-- ========================================== -->
  <!-- LEFT SIDE: CLEAN GEOMETRIC ICON            -->
  <!-- ========================================== -->
  <g transform="translate(10, 0)">
    <!-- The Sunburst Rays (Mathematically clean paths, no checkerboard glitches) -->
    <g class="logo-amber">
      <path d="M 60,195 L 140,210 L 140,205 Z" />
      <path d="M 75,130 L 150,160 L 147,153 Z" />
      <path d="M 115,75 L 175,115 L 170,110 Z" />
      <path d="M 175,35 L 215,95 L 210,92 Z" />
      <path d="M 250,15 L 260,85 L 255,85 Z" />
      <path d="M 325,35 L 295,92 L 290,95 Z" />
      <path d="M 385,75 L 335,110 L 330,115 Z" />
      <path d="M 425,130 L 358,153 L 355,160 Z" />
      <path d="M 440,195 L 365,205 L 365,210 Z" />
    </g>

    <!-- The Sun Arch (Perfect semi-circle with precise 18px stroke thickness) -->
    <path d="M 142,204 A 112,112 0 0,1 361,204" fill="none" class="logo-amber" stroke="#d89100" stroke-width="18" />

    <!-- Main Roof & Chimney Architecture (Deep Navy structural block) -->
    <g class="logo-navy">
      <!-- Sharp Roof Peak & Slopes -->
      <path d="M 241,162 L 60,290 L 80,314 L 241,200 L 402,314 L 422,290 Z" />
      <!-- Seamless Solid Chimney Stack -->
      <path d="M 340,200 L 340,250 L 375,275 L 375,200 Z" />
    </g>

    <!-- Four Symmetrical Window Panes (Perfect mathematical alignment grid) -->
    <g class="logo-amber" transform="translate(216, 255)">
      <rect x="0" y="0" width="22" height="22" />
      <rect x="27" y="0" width="22" height="22" />
      <rect x="0" y="25" width="22" height="22" />
      <rect x="27" y="25" width="22" height="22" />
    </g>
  </g>

  <!-- ========================================== -->
  <!-- RIGHT SIDE: PREMIUM BLOCK TYPOGRAPHY       -->
  <!-- ========================================== -->

  <!-- "RISE" - Set in clean, heavy, modern geometric block font -->
  <text x="460" y="215"
        class="logo-navy"
        font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
        font-size="142"
        font-weight="900"
        letter-spacing="2">RISE</text>

  <!-- The Architectural Horizontal Divider Line -->
  <line x1="462" y1="242" x2="960" y2="242" stroke="#d89100" stroke-width="6" stroke-linecap="square" />

  <!-- "CONTRACTING" - Tracked out perfectly to anchor the visual footprint edges -->
  <text x="462" y="298"
        class="logo-navy"
        font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
        font-size="43"
        font-weight="700"
        letter-spacing="15.8">CONTRACTING</text>
</svg>
